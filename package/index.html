<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flip Clock</title>
<style>
:root{font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#20242c;background:#f3f5f8;--accent:#366ce7}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 22px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:18px;margin:0 0 18px}p{margin:6px 0;color:#697382}.eyebrow{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:2px}.back{color:#52647e;text-decoration:none;font-size:14px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.card{background:white;border:1px solid #e4e8ef;border-radius:20px;padding:24px;box-shadow:0 4px 18px #21375504}.wide{grid-column:1/-1}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.swatch{border:2px solid transparent;border-radius:12px;background:#f6f7fa;padding:9px 5px;cursor:pointer;color:#475167;font:inherit;font-size:12px}.swatch[aria-pressed=true]{border-color:var(--accent);background:#eff4ff}.chip{display:block;width:36px;height:36px;border-radius:9px;margin:0 auto 6px;background:var(--bg);color:var(--fg);font:bold 22px/36px monospace}.field{margin-top:20px}label,.field-title{display:block;font-weight:600;margin-bottom:8px}select,input[type=text]{width:100%;background:#fff;border:1px solid #d7dfe9;border-radius:10px;padding:11px 12px;color:inherit;font:inherit}.switch{display:flex;align-items:center;gap:10px;font-weight:500;margin:18px 0 0}input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}.hint{font-size:12px;margin-top:8px}.weather{padding:15px 17px;background:#f3f6fc;border-radius:12px;margin-top:20px}.weather strong{display:block;font-size:22px}.weather span{color:#63738b;font-size:13px}.actions{display:flex;align-items:center;gap:16px;margin-top:20px}#save{border:0;border-radius:11px;padding:12px 28px;background:var(--accent);color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#message{font-size:13px;color:#496381}#message.error{color:#b72a31}.guide{display:grid;grid-template-columns:1fr 1fr;gap:24px}.guide b{font-size:14px}.guide p{font-size:13px;margin:5px 0}footer{margin-top:20px;font-size:12px;color:#7b8594}button:focus-visible,a:focus-visible{outline:3px solid #88aaff;outline-offset:3px}@media(max-width:680px){main{padding:20px 14px}.grid,.guide{grid-template-columns:1fr}.colors{grid-template-columns:repeat(4,1fr)}header{align-items:flex-start}h1{font-size:26px}.card{padding:20px}}
</style></head><body><main>
<header><div><div class="eyebrow">CUBIC / FLIP CLOCK</div><h1 data-i="title">翻页时钟</h1><p data-i="subtitle">让时间，以你的方式翻动。</p></div><a class="back" href="/main" data-i="back">返回控制台 ↗</a></header>
<form id="settings"><div class="grid"><section class="card"><h2 data-i="appearance">外观与动画</h2><div class="colors" id="colors"></div>
<div class="field"><label for="motion" data-i="motion">翻页样式</label><select id="motion"><option value="original" data-i="original">经典翻页</option><option value="rebound" data-i="rebound">机械回弹</option></select></div>
<label class="switch"><input id="seconds" type="checkbox"><span data-i="seconds">显示秒数</span></label><p class="hint" data-i="secondsHint">关闭秒数后，自动使用更大的双卡片时钟。</p>
</section><section class="card"><h2 data-i="weatherTitle">天气</h2>
<div class="weather" aria-live="polite"><strong id="weather">—</strong><span id="condition">—</span></div>

</section><section class="card wide"><h2 data-i="controls">设备操作</h2><div class="guide"><div><b data-i="gyro">重力感应</b><p data-i="gyroHelp">左倾保持换色，右倾保持切换秒数，右倾后快速回正切换动画；前后倾无功能。</p></div><div><b data-i="pad">手柄 / Home</b><p data-i="padHelp">左右：配色 · 上 / A：秒数 · 下：动画 · B / Select / Home：退出。</p></div></div></section></div>
<div class="actions"><button id="save" type="submit" disabled data-i="save">保存并应用</button><span id="message" role="status" aria-live="polite"></span></div></form><footer data-i="footer">设置保存在本机 · 天气每分钟自动更新 · 独立运行，无需启动 Weather</footer>
</main><script>
const BASE='__BASE__',TOKEN='__TOKEN__';
const tr={"zh-CN":{"weatherTitle":"天气","title":"翻页时钟","subtitle":"让时间，以你的方式翻动。","back":"返回控制台 ↗","appearance":"外观与动画","motion":"翻页样式","original":"经典翻页","rebound":"机械回弹","seconds":"显示秒数","secondsHint":"关闭秒数后，自动使用更大的双卡片时钟。","controls":"设备操作","gyro":"重力感应","gyroHelp":"左倾保持换色，右倾保持切换秒数，右倾后快速回正切换动画；前后倾无功能。","pad":"手柄 / Home","padHelp":"左右：配色 · 上 / A：秒数 · 下：动画 · B / Select / Home：退出。","save":"保存并应用","footer":"设置保存在本机 · 天气每分钟自动更新 · 独立运行，无需启动 Weather","saved":"已保存并应用","saving":"正在保存…","loading":"正在连接设备…","failed":"连接失败，请刷新后重试","pending":"等待天气","stale":"天气暂不可用，将自动重试","colors":["黑白","纯白","琥珀","冰蓝","紫晶","奶油","血红"]},"en":{"weatherTitle":"Weather","title":"Flip Clock","subtitle":"Time, with your own character.","back":"Device console ↗","appearance":"Colour & animation","motion":"Flip style","original":"Classic flip","rebound":"Mechanical rebound","seconds":"Show seconds","secondsHint":"Turn off seconds for a larger two-card clock.","controls":"Device controls","gyro":"Tilt controls","gyroHelp":"Hold a left tilt: colour. Hold a right tilt: seconds. Brief right tilt: animation. Forward/back tilt does nothing.","pad":"Gamepad / Home","padHelp":"Left/right: colour · Up / A: seconds · Down: animation · B / Select / Home: exit.","save":"Save & apply","footer":"Saved on this device · Weather refreshes every minute · Runs independently of Weather","saved":"Saved and applied","saving":"Saving…","loading":"Connecting to device…","failed":"Connection failed. Reload and retry.","pending":"Waiting for weather","stale":"Weather unavailable; retrying automatically","colors":["Mono","White","Amber","Ice","Violet","Cream","Red"]},"de":{"weatherTitle":"Wetter","title":"Flip-Uhr","subtitle":"Zeit mit deinem eigenen Stil.","back":"Gerätekonsole ↗","appearance":"Farbe & Animation","motion":"Blätterstil","original":"Klassisch","rebound":"Mechanischer Rückprall","seconds":"Sekunden anzeigen","secondsHint":"Ohne Sekunden werden zwei größere Karten angezeigt.","controls":"Bedienung","gyro":"Neigung","gyroHelp":"Links geneigt halten: Farbe. Rechts halten: Sekunden. Kurz rechts neigen: Animation. Vorne/hinten: keine Funktion.","pad":"Gamepad / Home","padHelp":"Links/rechts: Farbe · Oben / A: Sekunden · Unten: Animation · B / Select / Home: beenden.","save":"Speichern & anwenden","footer":"Lokal gespeichert · Wetter jede Minute · Unabhängig von der Wetter-App","saved":"Gespeichert und angewendet","saving":"Wird gespeichert…","loading":"Verbindung wird hergestellt…","failed":"Verbindung fehlgeschlagen. Seite neu laden.","pending":"Wetter wird geladen","stale":"Wetter nicht verfügbar; erneuter Versuch folgt","colors":["Mono","Weiß","Bernstein","Eis","Violett","Creme","Rot"]},"ja":{"weatherTitle":"天気","title":"フリップ時計","subtitle":"時の流れを、自分らしく。","back":"デバイス管理 ↗","appearance":"カラーとアニメーション","motion":"めくりスタイル","original":"クラシック","rebound":"機械式リバウンド","seconds":"秒を表示","secondsHint":"秒を非表示にすると、大きな2枚のカードになります。","controls":"デバイス操作","gyro":"傾き操作","gyroHelp":"左傾を保持：カラー。右傾を保持：秒。短い右傾：アニメーション。前後の傾きは操作なし。","pad":"ゲームパッド / Home","padHelp":"左右：カラー · 上 / A：秒 · 下：アニメーション · B / Select / Home：終了。","save":"保存して適用","footer":"本体に保存 · 天気は毎分更新 · Weatherアプリなしで動作","saved":"保存して適用しました","saving":"保存中…","loading":"接続中…","failed":"接続できません。再読み込みしてください。","pending":"天気を取得中","stale":"天気を取得できません。自動で再試行します","colors":["モノ","ホワイト","アンバー","アイス","バイオレット","クリーム","レッド"]}};
const $=id=>document.getElementById(id),themes=['dark','light','amber','ice','violet','cream','blood'],palette=[['#111','#fff'],['#fff','#111'],['#241c12','#ffc16a'],['#172735','#9cddff'],['#301d3d','#d7a0ff'],['#eadebf','#4b3526'],['#310c10','#ff3547']];
let lang='zh-CN',selected='dark',state,dirty=false;
function translate(l){lang=tr[l]?l:'en';document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=tr[lang][el.dataset.i]);document.title=tr[lang].title;renderColors()}
function renderColors(){$('colors').replaceChildren();themes.forEach((id,i)=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.setAttribute('aria-pressed',String(id===selected));const chip=document.createElement('span');chip.className='chip';chip.textContent='12';chip.style.setProperty('--bg',palette[i][0]);chip.style.setProperty('--fg',palette[i][1]);b.append(chip,document.createTextNode(tr[lang].colors[i]));b.onclick=()=>{selected=id;dirty=true;renderColors()};$('colors').append(b)})}
function msg(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
function weather(s){const w=s.weather||{};$('weather').textContent=(w.city||'—')+'  '+(w.temp==null?'--':w.temp)+'°C';$('condition').textContent=w.error?tr[lang].stale:(w.text||tr[lang].pending)}
function fill(s){state=s;selected=s.theme;$('motion').value=s.motion;$('seconds').checked=s.seconds;translate(s.resolved_language);weather(s);dirty=false;$('save').disabled=false}
async function load(initial=false){try{const r=await fetch(BASE+'/api/state',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();if(initial) {fill(s);msg('')}else{state=s;if(!dirty)fill(s);else weather(s)}}catch(e){if(initial)msg(tr[lang].failed,true)}}
$('settings').addEventListener('input',()=>dirty=true);
$('settings').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;msg(tr[lang].saving);try{const r=await fetch(BASE+'/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,theme:selected,motion:$('motion').value,seconds:$('seconds').checked})});const s=await r.json();if(!r.ok||!s.ok)throw Error(s.error||tr[lang].failed);fill(s);msg(tr[lang].saved)}catch(e){msg(e.message||tr[lang].failed,true)}finally{$('save').disabled=false}};
translate('zh-CN');msg(tr[lang].loading);load(true);setInterval(()=>load(),10000);
</script></body></html>
